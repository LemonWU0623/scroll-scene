<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字样所 · 穿过字腔</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; color: #212c2a; background: #faf4df; font: 16px/1.65 "PingFang SC", "Microsoft YaHei", sans-serif }
  h1, h2, p { margin: 0 }
  .stage, .sheet { position: relative }
  .sheet { min-height: 28rem; isolation: isolate; overflow: hidden }
  .plate { background: #d6cfb5 }
  .print { background: #ffcc73 }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1 }
  .label { position: absolute; top: 6%; left: 5%; font: 600 1rem/1.2 Georgia, "Songti SC", serif; letter-spacing: .1em }
  .caption { position: absolute; left: 5%; bottom: 7%; padding: .45rem .85rem; background: #faf4df; color: #172c30 }
  .caption h1, .caption h2 { font: 600 clamp(1.7rem, 4vw, 3.6rem)/1.2 "Songti SC", Georgia, serif }
  .caption p { margin: .25em 0 0; font-size: .9rem }
  .skip { position: absolute; z-index: 3; top: 4%; right: 4%; padding: .6em 1em; color: #172c30; background: #faf4df; font-size: .85rem }
  .content { max-width: 46rem; margin: auto; padding: 14vh 6vw 26vh }
  .content h2 { font: 600 2.2rem/1.3 "Songti SC", Georgia, serif; margin-bottom: .6em }
  .story[data-motion] { min-height: 240vh; min-height: 240svh }
  .story[data-motion] .stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; isolation: isolate }
  .story[data-motion] .sheet { position: absolute; inset: 0; min-height: 0 }
  .story[data-motion] .plate { z-index: 1; background: transparent; pointer-events: none }
  .story[data-motion] .plate .art { transform: scale(var(--zoom, 1)); transform-origin: 50% 50% }
  .story[data-motion] .plate .caption, .story[data-motion] .plate .label { opacity: var(--intro, 1); transform: translateY(var(--lift, 0px)) }
  .story[data-motion] .print .label, .story[data-motion] .print .caption { opacity: var(--arrival, 0) }
  .story[data-motion] .print .art { transform: scale(var(--print-zoom, 1.1)) }
  @media (max-width: 480px) { .sheet { min-height: 24rem } .caption { max-width: 90% } }
</style>
<main>
  <section class="story" aria-label="字样所印刷习作">
    <div class="stage">
      <a class="skip" href="#project">跳至作品手记</a>
      <section class="sheet plate">
        <svg class="art" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <pattern id="paper-lines" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 17.5H18" stroke="#2f5149" opacity=".11"/></pattern>
            <mask id="counter" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="720">
              <rect width="1200" height="720" fill="white"/>
              <ellipse cx="600" cy="360" rx="68" ry="116" fill="black" transform="rotate(12 600 360)"/>
            </mask>
          </defs>
          <g mask="url(#counter)">
            <rect width="1200" height="720" fill="#e4e4c7"/>
            <rect width="1200" height="720" fill="url(#paper-lines)"/>
            <ellipse cx="600" cy="360" rx="182" ry="241" fill="#19473d" transform="rotate(12 600 360)"/>
            <g fill="none" stroke="#305b51" stroke-width="1" opacity=".55">
              <path d="M0 119H1200M0 601H1200M418 0V720M782 0V720" stroke-dasharray="5 7"/>
            </g>
          </g>
        </svg>
        <span class="label">字样所</span>
        <div class="caption"><h1>穿过字腔</h1><p>字母 O 的负空间实验</p></div>
      </section>
      <section class="sheet print">
        <svg class="art" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="朱红、深蓝两种印色的圆环和斜线交叠成一张海报">
          <defs>
            <pattern id="hatch" width="17" height="17" patternUnits="userSpaceOnUse" patternTransform="rotate(24)"><rect width="6" height="17" fill="#253a69"/></pattern>
          </defs>
          <rect width="1200" height="720" fill="#ffcc73"/>
          <g fill="none" stroke="#d13c29">
            <circle cx="695" cy="250" r="171" stroke-width="83"/><circle cx="695" cy="250" r="297" stroke-width="16"/>
          </g>
          <path d="M39 481 638 72 894 321 340 720H39Z" fill="url(#hatch)"/>
        </svg>
        <span class="label">字样所</span>
        <div class="caption"><h2>两色套印</h2><p>朱红先落纸，深蓝压在上面。</p></div>
      </section>
    </div>
  </section>
  <section class="content" id="project" tabindex="-1"><h2>作品手记</h2><p>画字的时候，我总盯着墨色。这次把 O 中间那块空白留下来，拿它当取景框，试了两种油墨的叠印。</p></section>
</main>
<script>
  (() => {
    const story = document.querySelector(".story");
    const stage = story.querySelector(".stage");
    const preference = matchMedia("(prefers-reduced-motion: reduce)");
    const clamp = value => Math.max(0, Math.min(1, value));
    const segment = (p, start, end) => clamp((p - start) / (end - start));
    const smooth = t => t * t * (3 - 2 * t);
    let frame = 0;

    function paint() {
      frame = 0;
      const bounds = story.getBoundingClientRect();
      const p = clamp(-bounds.top / Math.max(1, bounds.height - stage.clientHeight));
      const travel = smooth(segment(p, .08, .9));
      // The mask and ink share one SVG. Its centred hole expands past all
      // viewport corners for every xMidYMid slice crop of this viewBox.
      const zoom = Math.exp(travel * Math.log(12));
      const intro = 1 - smooth(segment(p, .08, .32));
      stage.style.setProperty("--zoom", zoom);
      stage.style.setProperty("--intro", intro);
      stage.style.setProperty("--lift", ((intro - 1) * 42) + "px");
      stage.style.setProperty("--arrival", smooth(segment(p, .74, .94)));
      stage.style.setProperty("--print-zoom", 1.12 - .12 * travel);
    }

    function requestPaint() {
      if (!frame) frame = requestAnimationFrame(paint);
    }
    const observer = new ResizeObserver(requestPaint);
    function configure() {
      const animate = !preference.matches;
      story.toggleAttribute("data-motion", animate);
      if (animate) {
        window.addEventListener("scroll", requestPaint, { passive: true });
        window.addEventListener("pageshow", requestPaint);
        observer.observe(stage);
        observer.observe(story);
        paint();
      } else {
        window.removeEventListener("scroll", requestPaint);
        window.removeEventListener("pageshow", requestPaint);
        observer.disconnect();
        cancelAnimationFrame(frame);
        frame = 0;
      }
    }
    preference.addEventListener("change", configure);
    configure();
  })();
</script>
</html>
